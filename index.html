<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Career Data UX</title><link rel="stylesheet" href="/style.css"></head><body><header><b>STUDY<span>×</span>CAREER</b><small>DATA UX MVP</small></header><main><section class="hero"><label>BIG DATA × EDUCATION × DESIGN</label><h1>나의 학습 데이터를<br><strong>진로와 연결하다</strong></h1><p>성적·오답률·학습시간·관심 분야를 분석해 학습 우선순위와 진로 키워드를 제안합니다.</p></section><section class="grid"><div class="card"><h2>01. 학습 데이터 입력</h2><p>현재 성적과 학습 습관을 입력하세요.</p><div id="subjects"></div><button id="add">+ 과목 추가</button><label>하루 평균 학습시간</label><input id="time" type="number" min="0" step="0.5" placeholder="예: 3.5"></div><div class="card"><h2>02. 관심 진로 분야</h2><p>관심 분야를 선택하세요.</p><div id="chips"><button data-v="UX/HCI">UX / HCI</button><button data-v="AI">AI</button><button data-v="컴퓨터그래픽스">컴퓨터그래픽스</button><button data-v="XR">XR / VR·AR</button><button data-v="디자인공학">디자인공학</button></div><button id="analyze" class="primary">데이터 분석하기 →</button></div></section><section class="card"><h2>나의 학습·진로 분석</h2><div id="summary">아직 분석 전</div><div id="rec" class="rec">위의 데이터를 입력하고 분석을 시작하세요.</div><div id="bars"></div><h3>추천 진로 키워드</h3><div id="keys"></div></section></main><footer>Study Career Data UX · Big Data 기반 맞춤형 학습·진로 설계 MVP</footer><script src="/app.js"></script></body></html>
